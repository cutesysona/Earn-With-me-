<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONA Daily Life Hub — Watch & Learn</title>

<!-- Keep your existing AdSense code only once. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4452420538906749"
        crossorigin="anonymous"></script>

<style>
:root{--bg:#0b1220;--card:#111c2d;--card2:#17243a;--border:#2b3b55;--text:#fff;--muted:#9eacc1;--accent:#ff3158}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.watch-learn-section{width:min(1180px,94%);margin:40px auto;padding:28px;border-radius:24px;background:var(--card);border:1px solid var(--border)}
.header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}
.kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
h1{margin:7px 0;font-size:30px}.header p{margin:0;color:var(--muted)}
.channel-btn,.search-btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}
.channel-btn{background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
.search-row{display:flex;gap:10px;margin-bottom:12px}
#searchInput{flex:1;min-width:0;padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:16px;outline:none}
.search-btn{background:#fff;color:#111c2d}
.status{min-height:22px;color:var(--muted);font-size:14px;margin:8px 0 16px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:25px}
.result{overflow:hidden;border:1px solid var(--border);border-radius:14px;background:var(--card2);cursor:pointer}
.result:hover{border-color:#6b7e9e}.result img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.result-body{padding:13px}.result-title{font-size:15px;font-weight:800;line-height:1.35}.result-date{margin-top:7px;font-size:12px;color:var(--muted)}
.player-card{overflow:hidden;border:1px solid var(--border);border-radius:18px;background:#060b13}
.player-title{padding:16px 18px}.player-title small{display:block;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase}.player-title strong{display:block;margin-top:5px}
.player-wrap{aspect-ratio:16/9;background:#000}#youtubePlayer{width:100%;height:100%}
.player-info{display:flex;justify-content:space-between;gap:15px;padding:12px 18px;color:var(--muted);font-size:13px}
.ad-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.84);z-index:999999}
.ad-overlay.active{display:flex}.ad-modal{width:min(850px,96vw);max-height:94vh;overflow:auto;border-radius:20px;background:#111827;border:1px solid #34445f;box-shadow:0 30px 100px rgba(0,0,0,.65)}
.ad-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding:18px 20px}
.ad-label{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--muted)}.ad-head h2{margin:5px 0 0;font-size:20px}
.ad-close{width:38px;height:38px;border:0;border-radius:50%;background:#273449;color:#fff;font-size:25px;cursor:pointer}
#customAdVideo{width:100%;max-height:65vh;display:block;background:#000}
.ad-foot{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 20px;color:var(--muted);font-size:13px}
.ad-skip{border:0;border-radius:10px;padding:10px 17px;background:#fff;color:#111827;font-weight:800;cursor:pointer}
@media(max-width:700px){.watch-learn-section{width:96%;padding:18px}.header{flex-direction:column;align-items:stretch}.channel-btn{display:block;text-align:center}.search-row{flex-direction:column}.search-btn{height:48px}.player-info{flex-direction:column}}
</style>
</head>

<body>
<section class="watch-learn-section">
  <div class="header">
    <div>
      <div class="kicker">WATCH &amp; LEARN</div>
      <h1>Learn with our YouTube videos</h1>
      <p>Search and watch public videos from our YouTube channel.</p>
    </div>
    <a id="channelBtn" class="channel-btn" target="_blank" rel="noopener noreferrer">Visit YouTube Channel</a>
  </div>

  <div class="search-row">
    <input id="searchInput" type="search" placeholder="Search videos..." autocomplete="off">
    <button id="searchBtn" class="search-btn" type="button">Search</button>
  </div>
  <div id="status" class="status"></div>
  <div id="results" class="results"></div>

  <div class="player-card">
    <div class="player-title"><small>Now Watching</small><strong id="currentTitle">Select a video</strong></div>
    <div class="player-wrap"><div id="youtubePlayer"></div></div>
    <div class="player-info">
      <span id="watchTimer">Watch time: 0:00</span>
      <span>Website promotion break every 10 minutes of playback</span>
    </div>
  </div>
</section>

<div id="adOverlay" class="ad-overlay" aria-hidden="true">
  <div class="ad-modal">
    <div class="ad-head">
      <div><div class="ad-label">SPONSORED</div><h2 id="adTitle">A short message from us</h2></div>
      <button id="adClose" class="ad-close" type="button" aria-label="Close">×</button>
    </div>
    <video id="customAdVideo" playsinline controls preload="metadata"></video>
    <div class="ad-foot"><span id="adCounter">Promotion 1 of 3</span><button id="adSkip" class="ad-skip" type="button">Skip</button></div>
  </div>
</div>

<script>
/* ===================== CONFIGURATION =====================
   Replace these values before publishing. */
const CONFIG={
  YOUTUBE_CHANNEL_ID:'YOUR_CHANNEL_ID',
  YOUTUBE_API_KEY:'YOUR_YOUTUBE_API_KEY',
  YOUTUBE_CHANNEL_URL:'https://www.youtube.com/@YOUR_CHANNEL_NAME',
  AD_BREAK_SECONDS:600,
  ADS_PER_BREAK:3,
  CUSTOM_ADS:[
    {title:'Special Announcement',src:'/ads/ad-1.mp4'},
    {title:'Discover Our Latest Offer',src:'/ads/ad-2.mp4'},
    {title:'Thank You for Watching',src:'/ads/ad-3.mp4'}
  ]
};

const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const statusEl=document.getElementById('status');
const resultsEl=document.getElementById('results');
const currentTitle=document.getElementById('currentTitle');
const watchTimer=document.getElementById('watchTimer');
const channelBtn=document.getElementById('channelBtn');
const adOverlay=document.getElementById('adOverlay');
const adTitle=document.getElementById('adTitle');
const adVideo=document.getElementById('customAdVideo');
const adCounter=document.getElementById('adCounter');
const adClose=document.getElementById('adClose');
const adSkip=document.getElementById('adSkip');

channelBtn.href=CONFIG.YOUTUBE_CHANNEL_URL;

let player=null,playerReady=false,playerState=-1,watchSeconds=0,lastTick=Date.now(),adOpen=false,adIndex=0;

function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

(function loadYouTubeAPI(){
  if(window.YT&&window.YT.Player){createPlayer();return}
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady=createPlayer;

function createPlayer(){
  if(player)return;
  player=new YT.Player('youtubePlayer',{
    width:'100%',height:'100%',videoId:'',
    host:'https://www.youtube-nocookie.com',
    playerVars:{autoplay:0,controls:1,playsinline:1,rel:0,enablejsapi:1,origin:window.location.origin},
    events:{
      onReady:()=>{playerReady=true;lastTick=Date.now()},
      onStateChange:e=>{playerState=e.data;lastTick=Date.now()}
    }
  });
}

/* Count only actual YouTube PLAYING time. */
setInterval(()=>{
  const now=Date.now(),elapsed=(now-lastTick)/1000;
  lastTick=now;
  if(!playerReady||adOpen)return;
  if(playerState===YT.PlayerState.PLAYING){
    watchSeconds+=elapsed;updateTimer();
    if(watchSeconds>=CONFIG.AD_BREAK_SECONDS)openAdBreak();
  }
},1000);

function updateTimer(){
  const total=Math.floor(watchSeconds),min=Math.floor(total/60),sec=total%60;
  watchTimer.textContent='Watch time: '+min+':'+String(sec).padStart(2,'0');
}

searchBtn.addEventListener('click',searchVideos);
searchInput.addEventListener('keydown',e=>{if(e.key==='Enter')searchVideos()});

async function searchVideos(){
  const query=searchInput.value.trim();
  if(!query){statusEl.textContent='Please enter something to search.';return}
  if(CONFIG.YOUTUBE_CHANNEL_ID==='YOUR_CHANNEL_ID'){statusEl.textContent='Add your YouTube Channel ID in the CONFIG section.';return}
  if(CONFIG.YOUTUBE_API_KEY==='YOUR_YOUTUBE_API_KEY'){statusEl.textContent='Add your YouTube Data API key in the CONFIG section.';return}

  statusEl.textContent='Searching YouTube...';resultsEl.innerHTML='';
  const p=new URLSearchParams({
    part:'snippet',channelId:CONFIG.YOUTUBE_CHANNEL_ID,q:query,type:'video',
    maxResults:'12',videoEmbeddable:'true',order:'relevance',safeSearch:'moderate',
    key:CONFIG.YOUTUBE_API_KEY
  });

  try{
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+p.toString());
    const data=await r.json();
    if(!r.ok)throw new Error(data?.error?.message||'YouTube search failed.');
    const items=Array.isArray(data.items)?data.items:[];
    if(!items.length){statusEl.textContent='No videos found.';return}
    statusEl.textContent=items.length+' video'+(items.length===1?'':'s')+' found.';
    renderResults(items);
  }catch(err){
    console.error(err);
    statusEl.textContent='Unable to search YouTube. Check your API key and channel ID.';
  }
}

function renderResults(items){
  resultsEl.innerHTML='';
  items.forEach(item=>{
    const id=item?.id?.videoId;if(!id)return;
    const title=item?.snippet?.title||'YouTube Video';
    const thumb=item?.snippet?.thumbnails?.high?.url||item?.snippet?.thumbnails?.medium?.url||item?.snippet?.thumbnails?.default?.url||'';
    const date=item?.snippet?.publishedAt?new Date(item.snippet.publishedAt).toLocaleDateString():'';
    const card=document.createElement('article');
    card.className='result';
    card.innerHTML='<img src="'+escapeHtml(thumb)+'" alt="" loading="lazy"><div class="result-body"><div class="result-title">'+escapeHtml(title)+'</div><div class="result-date">'+escapeHtml(date)+'</div></div>';
    card.addEventListener('click',()=>loadVideo(id,title));
    resultsEl.appendChild(card);
  });
}

function loadVideo(videoId,title){
  if(!playerReady||!player)return;
  watchSeconds=0;updateTimer();currentTitle.textContent=title||'YouTube Video';
  player.loadVideoById(videoId);
  document.querySelector('.player-card')?.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ================= CUSTOM WEBSITE PROMOTION BREAK ================= */
function openAdBreak(){
  if(adOpen)return;
  const ads=CONFIG.CUSTOM_ADS.slice(0,CONFIG.ADS_PER_BREAK);
  if(!ads.length)return;
  adOpen=true;adIndex=0;watchSeconds=0;updateTimer();
  if(player?.pauseVideo)player.pauseVideo();
  adOverlay.classList.add('active');adOverlay.setAttribute('aria-hidden','false');
  playCurrentAd();
}

function playCurrentAd(){
  const ads=CONFIG.CUSTOM_ADS.slice(0,CONFIG.ADS_PER_BREAK);
  if(adIndex>=ads.length){closeAdBreak();return}
  const ad=ads[adIndex];
  adTitle.textContent=ad.title||'Sponsored message';
  adCounter.textContent='Promotion '+(adIndex+1)+' of '+ads.length;
  adVideo.pause();adVideo.src=ad.src;adVideo.currentTime=0;adVideo.load();
  adVideo.onended=()=>{adIndex++;playCurrentAd()};
  adVideo.onerror=()=>{console.warn('Could not load custom ad:',ad.src);adIndex++;playCurrentAd()};
  const promise=adVideo.play();
  if(promise?.catch)promise.catch(()=>{});
}

adSkip.addEventListener('click',()=>{adIndex++;playCurrentAd()});
adClose.addEventListener('click',()=>closeAdBreak());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&adOpen)closeAdBreak()});

function closeAdBreak(){
  adVideo.pause();adVideo.removeAttribute('src');adVideo.load();
  adOverlay.classList.remove('active');adOverlay.setAttribute('aria-hidden','true');
  adOpen=false;adIndex=0;lastTick=Date.now();
  if(player?.playVideo)player.playVideo();
}
</script>
</body>
</html>
